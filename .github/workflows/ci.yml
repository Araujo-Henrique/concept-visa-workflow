name: CI

# Quando roda: a cada push na main e em todo pull request.
on:
  push:
    branches: [main]
  pull_request:

# O token do workflow só precisa ler o código (menor privilégio).
permissions:
  contents: read

# Se chegar um push novo na mesma branch, cancela a execução antiga que ficou para trás.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------------------------
  # Backend: pytest contra um PostgreSQL de verdade (o mesmo tipo de banco da produção).
  # ---------------------------------------------------------------------------------------------
  backend:
    name: Backend (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Um PostgreSQL descartável, criado só para esta execução. O nome termina em _test,
    # que é a regra de segurança do conftest (ele se recusa a rodar em outro banco).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: concept_visa_workflow_test
        ports:
          - 5432:5432
        # Só começa os passos quando o banco já aceita conexões.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Segredos de verdade nunca entram aqui: é um banco que nasce e morre dentro do job.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/concept_visa_workflow_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip # guarda o download das bibliotecas entre execuções

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # O conftest recria o esquema e roda `alembic upgrade head`: se uma migration quebrar,
      # a suíte inteira falha aqui, num banco vazio (sem nenhum estado da sua máquina).
      # --cov mede quais linhas e ramos os testes executam; o resumo (com as linhas que faltam)
      # aparece no log. Ainda sem piso mínimo: primeiro olhamos os números, depois decidimos.
      - name: Rodar testes com cobertura
        run: python -m pytest -q --cov=app --cov=scripts --cov-branch --cov-report=term-missing:skip-covered

  # ---------------------------------------------------------------------------------------------
  # Front: formatação, lint, tipos e Jest (é o mesmo `npm test` que você roda localmente).
  # ---------------------------------------------------------------------------------------------
  frontend:
    name: Front (lint, tipos e Jest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    env:
      HUSKY: "0" # no CI não instala os hooks de commit (o script `prepare` respeita isso)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` instala exatamente o que está no package-lock.json (reprodutível);
      # `npm install` poderia escolher versões diferentes.
      - name: Instalar dependências
        run: npm ci

      - name: Formatação, lint, tipos e testes
        run: npm test

      # Só o que vai para produção, e só falha em severidade alta ou crítica.
      # As falhas moderadas que sobraram estão em ferramentas de desenvolvimento (ver README).
      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=high

  # ---------------------------------------------------------------------------------------------
  # Ponta a ponta: o Next de verdade (`next dev`) falando com a API de verdade e um PostgreSQL.
  # Confere a proteção de rotas (sem login volta ao login, cookie falso é recusado pela API).
  # ---------------------------------------------------------------------------------------------
  e2e:
    name: Ponta a ponta (Next + API + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: concept_visa_workflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Valores descartáveis: o banco nasce e morre dentro do job.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/concept_visa_workflow
      JWT_SECRET: segredo-descartavel-do-ci-com-mais-de-32-caracteres
      API_URL: http://127.0.0.1:8000 # é daqui que o servidor do Next lê o endereço da API
      NEXT_TELEMETRY_DISABLED: "1"
      HUSKY: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências da API
        run: pip install -r requirements.txt

      - name: Criar as tabelas (migrations)
        run: alembic upgrade head

      # A API sobe em segundo plano (`&`) e o passo seguinte espera ela responder antes de testar.
      - name: Subir a API
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/saude > /dev/null && exit 0
            sleep 1
          done
          echo "A API não subiu em 30s"; cat api.log; exit 1

      - name: Instalar dependências do front
        working-directory: web
        run: npm ci

      - name: Testes ponta a ponta
        working-directory: web
        run: npm run test:e2e

      # Se algo falhou, o log da API costuma dizer por quê.
      - name: Log da API (só se falhou)
        if: failure()
        run: cat api.log

  # ---------------------------------------------------------------------------------------------
  # Docker: o que vai para a VPS precisa construir e subir. Pega erro de Dockerfile/compose antes do deploy.
  # Valores descartáveis: nada aqui é segredo de verdade.
  # ---------------------------------------------------------------------------------------------
  docker:
    name: Docker (build e subida da pilha)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: senha-descartavel-do-ci-123
      POSTGRES_DB: ci_db
      JWT_SECRET: segredo-descartavel-do-ci-com-mais-de-32-caracteres
      DOMINIO: localhost

    steps:
      - uses: actions/checkout@v4

      - name: Validar o docker-compose.yml
        run: docker compose config --quiet

      # Sem o Caddy: ele precisa de um domínio real para o certificado. Banco, API e front sobem de verdade.
      - name: Construir e subir banco, API e front
        run: docker compose up -d --build db api web

      - name: Esperar ficarem saudáveis
        run: |
          for i in $(seq 1 36); do
            [ "$(docker compose ps --format '{{.Health}}' | grep -c '^healthy$')" = 3 ] && exit 0
            sleep 5
          done
          echo "A pilha não ficou saudável em 3 minutos"; docker compose ps; exit 1

      # De dentro da rede do Docker, como o front faz: a API responde e fala com o banco.
      - name: Conferir API e front
        run: |
          docker compose exec -T web node -e "fetch('http://api:8000/pronto').then(r=>process.exit(r.ok?0:1))"
          docker compose exec -T web node -e "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1))"

      - name: Logs (só se falhou)
        if: failure()
        run: docker compose logs --tail=100

      - name: Desligar
        if: always()
        run: docker compose down -v
